
name: Boda Borg Availability Checker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v4

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Requests installieren
        run: pip install requests

      - name: Verfügbarkeit prüfen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bodaborg_checker.py
        
      - name: Meldestatus speichern
        if: always()
        run: |
          if [ -f notified_sessions.json ]; then
            git config user.name "Boda Borg Checker"
            git config user.email "checker@users.noreply.github.com"
            git add notified_sessions.json
            git diff --cached --quiet || git commit -m "Update notification state"
            git push
          fi